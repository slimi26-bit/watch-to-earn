<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch to Earn</title>
    <!-- مكتبة تيليجرام الرسمية للربط -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --neon-green: #66fcf1;
            --neon-glow: #45a29e;
            --text-color: #c5c6c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* الحاوية الرئيسية بتصميم النيون والمتجاوبة مع كل الشاشات */
        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 20px var(--neon-glow);
            text-align: center;
        }

        h2 {
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-glow);
            margin-bottom: 10px;
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(102, 252, 241, 0.3);
        }

        .balance-title {
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .balance-amount {
            font-size: 2.3rem;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: 0 0 12px var(--neon-glow);
            margin-top: 8px;
        }

        .btn-neon {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--neon-glow);
            margin-top: 10px;
        }

        .btn-neon:hover {
            background: var(--neon-green);
            color: #0b0c10;
            box-shadow: 0 0 25px var(--neon-green);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Watch to Earn 🐺</h2>
        <p style="color: var(--text-color); font-size: 0.9rem;">start watch ads and earn</p>
        
        <div class="balance-card">
            <div class="balance-title">رصيدك الحالي</div>
            <div class="balance-amount" id="balance">0.00 $</div>
        </div>

        <button class="btn-neon" onclick="watchAd()">🎬 مشاهدة إعلان ولسب النقاط</button>
    </div>

    <script>
        // إعلام تيليجرام بأن تطبيق الويب جاهز ويعمل بكامل مظهره
        window.Telegram.WebApp.ready();

        let currentBalance = 0.00;
        function watchAd() {
            currentBalance += 0.05;
            document.getElementById('balance').innerText = currentBalance.toFixed(2) + " $";
            
            // اهتزاز خفيف للهاتف عند كسب النقاط (إذا كان مدعوماً من تيليجرام)
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        }
    </script>
</body>
</html>
